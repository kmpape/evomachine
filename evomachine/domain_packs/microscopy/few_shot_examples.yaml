examples:
  - name: Explicit illumination imaging loop
    user_request: >-
      Start at the first field of view, capture a 100 ms image using LED wavelength 450 nm at 10
      percent brightness with the 465 nm filter, and wait for 3 seconds. At each step, move to the
      next field of view and repeat the same image and wait. Finish after 8 completed steps,
      then return to the first field of view.
    strategy: |
      initialise
          move_fov(target=first_fov)
          image(exposure=100, led=450nm, led_brightness=10, filter=465nm)
          wait(duration=3)

      step
          if observations.step_count >= 8:
              terminate
          else:
              move_fov(target=next_fov)
              image(exposure=100, led=450nm, led_brightness=10, filter=465nm)
              wait(duration=3)

      finalise
          move_fov(target=first_fov)

  - name: Bounded calculations from completed observations
    user_request: >-
      During initialisation move to the first FOV and take a 100 ms image with the 450 nm LED
      at 10 percent brightness and the 465 nm filter. During each step, if focus recovery was
      exhausted, abort. Otherwise terminate after 20 completed steps. Before that limit, calculate
      a pause in seconds as ten times one minus the latest saturation fraction, bounded between
      one and ten seconds. Wait for that duration and acquire another image with the same settings.
    strategy: |
      initialise
          move_fov(target=first_fov)
          image(exposure=100, led=450nm, led_brightness=10, filter=465nm)
      step
          exhausted = observations.focus_recovery_exhausted
          if exhausted:
              abort
          else:
              if observations.step_count >= 20:
                  terminate
              else:
                  pause = max(1, min(10 * (1 - observations.saturation_fraction), 10))
                  wait(duration=pause)
                  image(exposure=100, led=450nm, led_brightness=10, filter=465nm)
      finalise

  - name: Explicit LED imaging loop
    user_request: >-
      Move to the first field of view during setup. During each step, take a 25 ms image at LED
      wavelength 515 nm at 12 percent brightness with the 527 nm filter. Finish after 5 completed
      steps. No finalisation action is required.
    strategy: |
      initialise
          move_fov(target=first_fov)

      step
          if observations.step_count >= 5:
              terminate
          else:
              image(exposure=25, led=515nm, led_brightness=12, filter=527nm)

      finalise
  - name: Two passes over configured FOVs and registered ROIs
    user_request: >-
      Perform two imaging rounds over every configured FOV using a 100 ms exposure,
      the 450 nm LED at 10 percent brightness, and the 465 nm filter. After each image,
      count that FOV's registered ROIs and wait that many seconds, bounded between 1 and 10.
      Then finish and return to the first FOV. Do not detect new ROIs.
    strategy: |
      initialise
          rounds = 0
      step
          loop fovs:
              move_fov(target=current_fov)
              image(exposure=100, led=450nm, led_brightness=10, filter=465nm)
              count = 0
              loop rois:
                  count = count + 1
              pause = max(1, min(10, count))
              wait(duration=pause)
          rounds = rounds + 1
          if rounds >= 2:
              terminate
      finalise
          move_fov(target=first_fov)
