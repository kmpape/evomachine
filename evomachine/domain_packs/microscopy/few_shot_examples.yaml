examples:
  - name: Explicit illumination imaging loop
    user_request: >-
      Start at the first field of view, capture a 100 ms image using LED wavelength 450 nm, and wait
      for 3 seconds. At each step, move to the next field of view and repeat the same image and
      wait.
    strategy: |
      initialise
          move(target=first_fov)
          image(exposure=100ms, led=450nm)
          wait(duration=3s)

      step
          move(target=next_fov)
          image(exposure=100ms, led=450nm)
          wait(duration=3s)

      finalise

  - name: Explicit LED imaging loop
    user_request: >-
      Move to the first field of view during setup. During each step, take a 25 ms image at LED
      wavelength 515 nm. No finalisation action is required.
    strategy: |
      initialise
          move(target=first_fov)

      step
          image(exposure=25ms, led=515nm)

      finalise
