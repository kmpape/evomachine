commands:
  move_fov:
    description: Move to a field of view selected from the collection supplied by the application.
    runtime_errors:
      - device_not_ready
      - movement_failed
      - communication_failed
    arguments:
      target:
        description: Select the first or next physical field of view, or current_fov from an active fovs loop.
        type: enum
        values:
          - first_fov
          - next_fov
          - current_fov

  image:
    description: Capture an image using explicit acquisition and illumination settings.
    runtime_errors:
      - device_not_ready
      - image_acquisition_failed
      - processing_failed
      - communication_failed
    arguments:
      process:
        description: If true, detect trenches on the first image of this FOV, then segment and track mother cells on every processed image. Requires a configured segmentation channel. Processing finishes before the next DSL statement.
        type: boolean

      exposure:
        description: Camera exposure duration. Unit is ms.
        type: number
        minimum_inclusive: 1
        maximum_inclusive: 1000

      led:
        description: Illumination wavelength.
        type: enum
        values:
          - 385nm
          - 450nm
          - 515nm
          - 565nm
          - 645nm

      led_brightness:
        description: Illumination brightness as a percentage of the available LED output.
        type: number
        minimum_inclusive: 0
        maximum_inclusive: 100

      filter:
        description: Filter-wheel position used for the acquisition.
        type: enum
        values:
          - filter
          - 465nm
          - 527nm
          - 592nm
          - no_filter
          - blocking

  project:
    description: Project a full-field DMD pattern using explicit illumination settings.
    runtime_errors:
      - device_not_ready
      - projection_failed
      - communication_failed
    arguments:
      illumination_led:
        description: LED wavelength used to illuminate the DMD projection.
        type: enum
        values:
          - 385nm
          - 450nm
          - 515nm
          - 565nm
          - 645nm

      illumination_brightness:
        description: Projection illumination brightness as a percentage of available LED output.
        type: number
        minimum_inclusive: 0
        maximum_inclusive: 100

      duration:
        description: Length of the full-field projection. Unit is s.
        type: number
        minimum_exclusive: 0
        maximum_exclusive: 3600

  wait:
    description: Pause strategy execution for a bounded duration.
    runtime_errors: []
    arguments:
      duration:
        description: Length of the pause. Unit is s.
        type: number
        minimum_exclusive: 0
        maximum_inclusive: 10
  project_selected:
    description: Expose all buffered targets in the selected FOV simultaneously in one combined DMD pattern. Call after the ROI loop. Requires movement to that FOV and valid processing for nonempty selections. Empty selection is a no-op. Successful projection clears the buffer and records treatment for every included trench.
    runtime_errors:
      - targeted_projection_failed
    arguments:
      illumination_led:
        description: LED wavelength used to illuminate the DMD projection.
        type: enum
        values:
          - 385nm
          - 450nm
          - 515nm
          - 565nm
          - 645nm

      illumination_brightness:
        description: Projection illumination brightness as a percentage of available LED output.
        type: number
        minimum_inclusive: 0
        maximum_inclusive: 100

      duration:
        description: Exposure duration shared by all selected trench ROIs. Unit is s.
        type: number
        minimum_exclusive: 0
        maximum_inclusive: 100

  clear_projection_targets:
    description: Clear the selected FOV's pending projection targets. Requires loop fovs. Does not expose or move.
    runtime_errors:
      - runtime_failure
    arguments: {}

  select_roi:
    description: Add the current authorised ROI to its FOV's pending projection targets. Requires loop rois and valid processing. Duplicate additions are harmless. Does not expose or move.
    runtime_errors:
      - runtime_failure
    arguments: {}
