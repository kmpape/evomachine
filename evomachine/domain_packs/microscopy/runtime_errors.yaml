runtime_errors:
  device_not_ready:
    description: A device required by the strategy is unavailable or not initialised.
    action: abort
    max_retries: 0

  movement_failed:
    description: A requested field-of-view movement could not be completed reliably.
    action: retry
    max_retries: 2
    exhausted_action: terminate

  image_acquisition_failed:
    description: An image could not be acquired or saved.
    action: retry
    max_retries: 2
    exhausted_action: continue

  projection_failed:
    description: A requested DMD projection failed before illumination was attempted.
    action: retry
    max_retries: 2
    exhausted_action: continue

  projection_exposure_uncertain:
    description: Full-field illumination was attempted but its completion is uncertain. Never retry automatically because some exposure may already have been delivered.
    action: abort
    max_retries: 0

  communication_failed:
    description: Communication with a hardware device failed.
    action: retry
    max_retries: 2
    exhausted_action: abort

  runtime_failure:
    description: An unexpected internal strategy execution failure occurred.
    action: abort
    max_retries: 0

  processing_failed:
    description: DeLTA preprocessing, segmentation or lineage processing failed. Processing may have partially advanced, so the experiment stops without retry.
    action: abort
    max_retries: 0

  targeted_projection_failed:
    description: Targeted exposure failed or completion is uncertain. Never retry automatically because some UV may already have been delivered.
    action: abort
    max_retries: 0
