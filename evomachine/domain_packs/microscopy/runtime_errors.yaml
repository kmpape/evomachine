runtime_errors:
  device_not_ready:
    description: A device required by the strategy is unavailable or not initialised.
    action: abort
    max_retries: 0

  movement_failed:
    description: A requested field-of-view movement could not be completed reliably.
    action: retry
    max_retries: 2
    exhausted_action: terminate

  image_acquisition_failed:
    description: An image could not be acquired or saved.
    action: retry
    max_retries: 2
    exhausted_action: continue

  projection_failed:
    description: A requested DMD projection could not be completed.
    action: retry
    max_retries: 2
    exhausted_action: continue

  communication_failed:
    description: Communication with a hardware device failed.
    action: retry
    max_retries: 2
    exhausted_action: abort

  runtime_failure:
    description: An unexpected internal strategy execution failure occurred.
    action: abort
    max_retries: 0
