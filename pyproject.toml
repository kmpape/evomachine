[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evomachine"
version = "0.1.0"
description = "Microscope automation application (DE-LTA real-time evolution machine)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "scikit-image>=0.20,<0.21",
    "opencv-python-headless>=4.10",
    "pillow>=10.3",
    "tifffile>=2022.4.8",
    "numba>=0.60",
    "pyserial>=3.5",
    "pygame>=2.6",
    "PyQt5>=5.15",
    "pycromanager>=0.27",
    
    # GPU stack for the Linux + CUDA microscope. TensorFlow is pulled in by the
    # `delta` sibling repo (it only requires `tensorflow >= 2.12`); we pin it here
    # to 2.15 with the `[and-cuda]` extra to control the version and bundle the
    # CUDA runtime libraries.
    "tensorflow[and-cuda]==2.15.*",
    
    # Local sibling repos (live next to this one in the workspace). Their paths are
    # specified in the `[tool.uv.sources]` below.
    "delta2",
    "asitiger",
    "syncboard",
]

[tool.uv.sources]
delta2 = { path = "../de-lta-rt", editable = true }
asitiger = { path = "../asitiger", editable = true }
syncboard = { path = "../sync_board", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["evomachine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
